global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bitsync-nodes
    static_configs:
      - targets:
          - node0:9100
          - node1:9100
          - node2:9100
          - node3:9100
        labels:
          protocol: bitsync
