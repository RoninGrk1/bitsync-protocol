[workspace]
resolver = "3"
members = [
    "crates/bitsync-anchor",
    "crates/bitsync-consensus",
    "crates/bitsync-crypto",
    "crates/bitsync-p2p",
    "crates/bitsync-sources",
    "crates/bitsync-storage",
    "crates/bitsync-node",
    "sdk/rust",
]
default-members = [
    "crates/bitsync-anchor",
    "crates/bitsync-consensus",
    "crates/bitsync-crypto",
    "crates/bitsync-p2p",
    "crates/bitsync-sources",
    "crates/bitsync-storage",
    "crates/bitsync-node",
    "sdk/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["BitSync Protocol Contributors"]
repository = "https://github.com/RoninGrk1/bitsync-protocol"
rust-version = "1.85"

[workspace.dependencies]
bitsync-anchor = { path = "crates/bitsync-anchor" }
bitsync-consensus = { path = "crates/bitsync-consensus" }
bitsync-crypto = { path = "crates/bitsync-crypto" }
bitsync-p2p = { path = "crates/bitsync-p2p" }
bitsync-sources = { path = "crates/bitsync-sources" }
bitsync-storage = { path = "crates/bitsync-storage" }
bitsync-sdk = { path = "sdk/rust" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
hex = "0.4"
sha2 = "0.10"
blake3 = "1"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
sha3 = "0.10"
bitcoin = { version = "0.32", default-features = false, features = ["std", "serde"] }
proptest = "1"
prometheus = "0.13"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
async-trait = "0.1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dashmap = "6"
libp2p = { version = "0.56", default-features = false, features = ["tcp", "noise", "yamux", "gossipsub", "identify", "kad", "tokio", "macros"] }
frost-secp256k1-tr = "2"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
base45 = "=3.1.0"
zeroize = { version = "1", features = ["derive"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
